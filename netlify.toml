# Netlify 构建配置（与 GitHub 仓库绑定后生效）
[build]
  command = "pnpm install --no-frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # vendor/m3e-canvas 用 npm（package-lock.json），CI 内由 tools/build-canvas.mjs 自行 npm ci

[[headers]]
  for = "/canvas/*"
  [headers.values]
    # 静态画布子应用可安全缓存到下一次构建
    Cache-Control = "public, max-age=3600"
