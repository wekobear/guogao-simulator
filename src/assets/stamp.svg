<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 整体 rotate(-8deg)，背景透明 -->
  <g transform="rotate(-8 60 60)">
    <!-- 双圈红描边 (#B83D36，透明度 0.85) -->
    <!-- 外圈 -->
    <circle cx="60" cy="60" r="52" fill="none" stroke="#B83D36" stroke-width="3.5" opacity="0.85"/>
    <!-- 内圈 -->
    <circle cx="60" cy="60" r="45" fill="none" stroke="#B83D36" stroke-width="1.5" opacity="0.85"/>

    <!-- 中心衬线汉字「过」 -->
    <text x="60" y="60.5" 
          font-family="'Songti SC', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Noto Serif SC', 'Source Han Serif CN', 'STSong', 'SimSun', serif" 
          font-size="52" 
          font-weight="bold" 
          fill="#B83D36" 
          opacity="0.85" 
          text-anchor="middle" 
          dominant-baseline="central">过</text>

    <!-- 模拟盖章斑驳效果的背景色 (#F6F3EC) 小圆点 -->
    <circle cx="60" cy="8" r="1.5" fill="#F6F3EC"/>
    <circle cx="58" cy="15" r="1.1" fill="#F6F3EC"/>
    <circle cx="109" cy="55" r="1.6" fill="#F6F3EC"/>
    <circle cx="105" cy="64" r="1.0" fill="#F6F3EC"/>
    <circle cx="11" cy="66" r="1.4" fill="#F6F3EC"/>
    <circle cx="15" cy="58" r="1.1" fill="#F6F3EC"/>
    <circle cx="64" cy="112" r="1.5" fill="#F6F3EC"/>
    <circle cx="48" cy="105" r="1.2" fill="#F6F3EC"/>
    <circle cx="73" cy="45" r="1.3" fill="#F6F3EC"/>
    <circle cx="52" cy="52" r="1.1" fill="#F6F3EC"/>
    <circle cx="82" cy="74" r="1.2" fill="#F6F3EC"/>
    <circle cx="39" cy="78" r="1.4" fill="#F6F3EC"/>
    <circle cx="68" cy="84" r="1.0" fill="#F6F3EC"/>
  </g>
</svg>
